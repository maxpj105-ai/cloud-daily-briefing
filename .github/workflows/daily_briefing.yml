name: Daily Briefing Cloud Automation

on:
  schedule:
    # 00:00 UTC = 08:00 AM Taiwan Time (UTC+8)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from mobile GitHub App or web UI

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Daily Briefing & Push to LINE / Mobile
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/cloud_briefing_runner.py

      - name: Upload HTML Briefing Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-html
          path: output/*.html
