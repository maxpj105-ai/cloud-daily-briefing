name: Daily Briefing Cloud Automation

on:
  schedule:
    # 09:17 AM Taiwan Time (01:17 UTC) - Avoid peak integer minute queue
    - cron: '17 1 * * *'
  workflow_dispatch: # Allows manual trigger from mobile GitHub App or web UI

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Daily Briefing & Push to LINE / Mobile
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/cloud_briefing_runner.py

      - name: Upload HTML Briefing Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-briefing-html
          path: output/*.html
